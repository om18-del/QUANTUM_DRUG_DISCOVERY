name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Offline by default: no GitHub-hosted runner dependency on PubChem or RCSB
        # being reachable, and no flakiness from a third party. The live integration
        # tests are opt-in via QDDE_LIVE_NETWORK and run in the job below.
        run: |
          pytest -v

  live-network:
    name: live network (non-blocking)
    runs-on: ubuntu-latest
    # This job is informational. A third-party outage must not mark the build red,
    # so it is explicitly allowed to fail while still being visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the full suite with live integration tests enabled
        env:
          QDDE_LIVE_NETWORK: "1"
        run: |
          pytest -v
